# Protocol 28 / TransactionEnvelope: fee-bump fee at the signed int64 maximum.
#
# The FeeBumpTransaction struct carries fee as a signed int64. This fixture
# sets fee to i64::MAX (9223372036854775807) to confirm the codec represents
# the full signed 64-bit range at the high endpoint. The inner transaction is
# a standard V1 Payment envelope.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `union TransactionEnvelope` — Stellar-transaction.x lines 1001-1010;
#   * `struct FeeBumpTransactionEnvelope` — Stellar-transaction.x lines 993-999;
#   * `struct FeeBumpTransaction` — Stellar-transaction.x lines 975-991;
#   * `union FeeBumpTransactionInnerTx` — Stellar-transaction.x lines 975-980;
#   * `typedef int64 int64` — Stellar-types.x (fee-bump fee is an int64 XDR type).
#
# Why it matters: a decoder that treats the fee-bump fee as an unsigned uint64
# would decode i64::MAX correctly by coincidence, but i64::MIN would appear as
# a valid large positive number. Using i64::MAX confirms the signed
# interpretation at the boundary where sign does not mask the error. Combined
# with the V1 integer boundary fixtures this ensures both signed and unsigned
# 64-bit integer fields in the envelope codec are covered.
#
# The payload was produced by a program that builds the typed value with the
# official `stellar-xdr` 28.0.1 crate (features base64 and alloc — the crate
# version Protocol-Canary's canary-xdr pins for Protocol 28) and serialises
# it with WriteXdr::to_xdr_base64(Limits::none()), never hand-assembled.
#
# Generation expression, recorded verbatim:
#
#   TransactionEnvelope::TxFeeBump(FeeBumpTransactionEnvelope {
#       tx: FeeBumpTransaction {
#           fee_source: MuxedAccount::Ed25519(Uint256([0x44; 32])),
#           fee: i64::MAX,  // 9223372036854775807
#           inner_tx: FeeBumpTransactionInnerTx::Tx(TransactionV1Envelope {
#               tx: Transaction {
