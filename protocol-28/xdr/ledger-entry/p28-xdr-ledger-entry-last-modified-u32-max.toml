# Protocol 28 / LedgerEntry: `lastModifiedLedgerSeq` at uint32 maximum round-trips.
#
# What this tests:
# A `TRUSTLINE` LedgerEntry with `lastModifiedLedgerSeq = 4294967295` (uint32::MAX),
# confirming that the uint32 scalar for the ledger sequence is encoded and
# decoded correctly at its upper boundary.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `struct LedgerEntry` (`lastModifiedLedgerSeq` uint32 at line 549) — Stellar-ledger-entries.x lines 548-586;
#   * `struct TrustLineEntry` — Stellar-ledger-entries.x lines 276-307;
#   * `union TrustLineAsset` — Stellar-ledger-entries.x lines 247-262;
#   * `enum LedgerEntryType` — Stellar-ledger-entries.x lines 92-104.
#
# Why it matters: existing fixtures use ordinary mid-range values for
# `lastModifiedLedgerSeq`. This fixture pushes the uint32 scalar to its maximum
# to confirm structural boundary encoding.
#
# Expected result and where it comes from: kind = "roundtrip" means a
# decoder must accept this entry and re-encoding it must reproduce
# value_base64 byte for byte, not merely an equal value. The payload was
# produced by a program that builds the typed value with the official
# `stellar-xdr 28.0.1` crate (features base64, alloc — the crate version
# Protocol-Canary's canary-xdr pins for Protocol 28; rustc 1.91.0) and
# serialises it with to_xdr_base64(Limits::none()), never hand-assembled.
# Generation expression, recorded verbatim:
#
#   LedgerEntry {
#       last_modified_ledger_seq: u32::MAX,
#       data: LedgerEntryData::Trustline(TrustLineEntry {
#           account_id: AccountId(PublicKey::PublicKeyTypeEd25519(Uint256([0x33; 32]))),
#           asset: TrustLineAsset::CreditAlphanum4(AlphaNum4 {
#               asset_code: AssetCode4([b'U', b'S', b'D', 0]),
#               issuer: AccountId(PublicKey::PublicKeyTypeEd25519(Uint256([0x44; 32]))),
#           }),
#           balance: 1_000_000,
#           limit: i64::MAX,
#           flags: 0,
#           ext: TrustLineEntryExt::V0,
#       }),
#       ext: LedgerEntryExt::V0,
#   }
#
# The same program asserted the crate's own round trip: from_xdr_base64
# returned Ok and re-encoding the decoded value reproduced the encoding exactly.
#
# Is it deterministic: yes. The generator uses no randomness, clock or
# network; the same expression always yields the same bytes.
#
# Every payload byte is a synthetic structural value, not a capture of a real
# ledger entry: the 0x33-filled account id and 0x44-filled issuer are fixed
# placeholders; no secret key is used or represented anywhere. Nothing here
# was observed on a network.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-ledger-entries.x

