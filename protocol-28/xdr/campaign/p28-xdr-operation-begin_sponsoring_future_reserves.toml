# Protocol 28 / TransactionEnvelope V1: OperationBody::BEGIN_SPONSORING_FUTURE_RESERVES roundtrip.
#
# No pack envelope in Protocol 28 selects BEGIN_SPONSORING_FUTURE_RESERVES.
# Its required payload is a sponsored_id AccountID (PublicKey), so a focused
# fixture checks the key bytes directly after the operation type discriminant
# (OperationType 16). This fixture verifies the arm is decoded correctly and
# that re-encoding produces the original bytes.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `union TransactionEnvelope` — Stellar-transaction.x lines 1001-1010;
#   * `struct TransactionV1Envelope` — Stellar-transaction.x lines 967-973;
#   * `struct Transaction` — Stellar-transaction.x lines 932-965;
#   * `struct Operation` — Stellar-transaction.x lines 653-719;
#   * `enum OperationType` (BEGIN_SPONSORING_FUTURE_RESERVES = 16) — Stellar-transaction.x lines 480-508;
#   * `struct BeginSponsoringFutureReservesOp` — Stellar-transaction.x lines 609-612;
#   * `union PublicKey` — Stellar-types.x lines 53-57;
#   * `enum PublicKeyType` (PUBLIC_KEY_TYPE_ED25519 = 0) — Stellar-types.x lines 48-52;
#   * `typedef PublicKey AccountID` — Stellar-types.x line 100.
#
# Why it matters: BEGIN_SPONSORING_FUTURE_RESERVES opens a sponsorship ledger
# entry. A decoder that mishandles the OperationType 16 discriminant or the
# AccountID (PublicKey) sponsored_id field would corrupt sponsorship operations.
#
# The payload was produced by a program that builds the typed value with the
# official `stellar-xdr` 28.0.1 crate (features base64 and alloc — the crate
# version Protocol-Canary's canary-xdr pins for Protocol 28) and serialises
# it with WriteXdr::to_xdr_base64(Limits::none()), never hand-assembled.
#
# Generation expression, recorded verbatim:
#
#   TransactionEnvelope::Tx(TransactionV1Envelope {
#       tx: Transaction {
#           source_account: MuxedAccount::Ed25519(Uint256([0x44; 32])),
#           fee: 100_000,
#           seq_num: SequenceNumber(2_345_678),
#           cond: Preconditions::None,
#           memo: Memo::None,
#           operations: vec![Operation {
#               source_account: None,
#               body: OperationBody::BeginSponsoringFutureReserves(
#                   BeginSponsoringFutureReservesOp {
