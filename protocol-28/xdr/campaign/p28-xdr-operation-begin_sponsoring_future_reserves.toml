#                           Uint256([0x55; 32])
#                       )),
#                   }
#               ),
#           }].try_into().unwrap(),
#           ext: TransactionExt::V0,
#       },
#       signatures: vec![DecoratedSignature {
#           hint: SignatureHint([0x66; 4]),
#           signature: Signature(BytesM::try_from(vec![0x66; 64]).unwrap()),
#       }].try_into().unwrap(),
#   }).to_xdr_base64(Limits::none())
#
# Crate: stellar-xdr 28.0.1; rustc 1.99.1 (58cf8f9c3 2026-10-13);
# generated 2026-11-23 (UTC). The same crate round-tripped the value:
# TransactionEnvelope::from_xdr_base64 followed by to_xdr reproduced the
# 188-byte encoding exactly, byte for byte.
#
# Every payload byte is a synthetic structural value, not a capture of a
# real network object: the 0x44-filled source account and the 0x55-filled
# sponsored_id are not real accounts, the 0x66-filled hint and signature
# are not a valid signature (no secret key is used anywhere), and the fee
# and sequence number are arbitrary fixed numbers. The signature does not
# sign anything: this is not a submitted transaction and was never observed
# on a network.
#
