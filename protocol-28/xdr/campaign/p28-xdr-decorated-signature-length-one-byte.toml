# Protocol 28 / TransactionEnvelope: DecoratedSignature with 1-byte signature.
#
# What this tests: a TransactionEnvelope V1 whose DecoratedSignature carries a
# 1-byte signature opaque sequence (hex 11) with 3 bytes of zero padding round-trips.
#
# Why it matters: `struct DecoratedSignature` in Stellar-transaction.x declares
# `opaque signature<64>`. A 1-byte opaque payload exercises the XDR 4-byte
# alignment and padding rule (1 data byte followed by 3 zero padding bytes).
#
# Introduced in:
# Protocol 1 (Stellar-transaction.x DecoratedSignature definition).
